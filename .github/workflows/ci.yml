name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    # Clipen targets macOS; FFmpeg-backed tests render real media.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/runtime.txt

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime.txt
          python -m pip install --no-deps -e .

      - name: Run unit tests
        env:
          PYTHONPATH: tests/python
        run: python -m unittest discover -s tests/python

  web:
    name: Web build and dist check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Verify committed dist matches source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::apps/web/dist 與原始碼不一致，請執行 npm run build 後提交 dist。"
            git status --porcelain -- dist
            exit 1
          fi

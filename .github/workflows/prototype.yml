name: Prototype checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Select supported OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          openssl_bin="$(brew --prefix openssl@3)/bin"
          test -x "$openssl_bin/openssl"
          echo "$openssl_bin" >> "$GITHUB_PATH"
      - name: Show runtime prerequisites
        run: |
          python --version
          node --version
          openssl version
          ffprobe -version || echo "FFprobe optional: inventory records an actionable issue when absent"
      - name: Verify signed product Skills
        run: python -m tools.skill_guard verify
      - name: Check proposed public tree
        run: python -m tools.release_audit
      - name: Check Python protocol, lifecycle, and performance bounds
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Check JavaScript and UI state regressions
        run: |
          node --check prototypes/local_ui/static/app.js
          node --check prototypes/local_ui/static/ui-state.js
          node --check prototypes/local_ui/static/workspace.js
          node --check prototypes/local_ui/static/workspace-state.js
          node --test tests/test_ui.mjs tests/test_preparation_ui.mjs
      - name: Check whitespace
        run: git show --format= --check HEAD

name: 問題回報
description: 回報可重現的 Clipen 問題
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Clipen 仍在原型階段。請勿附上 Token、開頁連結、私人影片、逐字稿或完整 AI 對話。
        優先提供合成文字與去識別的重現步驟。
  - type: input
    id: version
    attributes:
      label: 環境與版本
      description: 作業系統、Python、AI CLI 版本與 Clipen commit（不含私人路徑）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何重現
      placeholder: "1. 執行…\n2. 點選…\n3. 出現…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期與實際結果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 資料檢查
      options:
        - label: 我已移除憑證、私人素材、開頁 token 與個人路徑。
          required: true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipen"
version = "0.1.0"
description = "AI-assisted vlog auto-editing for raw video footage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "anthropic>=0.34",
    "openai>=1.40",
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
    "opentimelineio>=0.16",
    "pysrt>=1.1",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
clipen = "clipen.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipen"
version = "0.0.0"
description = "Local AI-assisted video editing workspace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
dependencies = [
    "cryptography==50.0.1",
    "jsonschema==4.26.0",
    "Pillow==12.3.0",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipen = ["py.typed"]
"clipen.skills" = ["travel-program/*.md", "travel-program/*.json", "travel-program/references/*.md", "travel-program/references/*.txt", "travel-program/assets/*.png", "travel-program/assets/*.mp4", "travel-program/scripts/*.py", "travel-program/template-skills/*/*.md", "travel-program/template-skills/*/*.json"]

"clipen.rendering" = ["fonts/*.ttf", "fonts/*.txt", "fonts/*.json"]
